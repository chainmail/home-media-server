# DHCP and TFTP only; DNS is provided by the configured upstream resolvers.
port=0

# Serve only the isolated cluster interface.
interface=eno1
listen-address=192.168.45.1
bind-interfaces
dhcp-authoritative

dhcp-range=192.168.45.50,192.168.45.99,255.255.255.0,24h
dhcp-option=option:router,192.168.45.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8

# DHCP option 66 supplies the TFTP server address. No boot filename is set here;
# add one only after verifying the selected Raspberry Pi/Talos boot flow.
dhcp-option=66,192.168.45.1

enable-tftp
tftp-root=/var/lib/tftpboot
log-dhcp
